[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-laya-free"
version = "0.2.0"
description = "Independent local typed-decision HTTP implementation with optional Laya backend"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
training = [
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=2.18",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "accelerate>=0.28",
    "safetensors>=0.4",
]

[project.scripts]
jev-laya-free = "jev_laya_free.server:main"

[tool.setuptools.packages.find]
where = ["src"]
