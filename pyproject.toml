[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-laya-free"
version = "0.2.0"
description = "Independent local typed-decision HTTP implementation with optional Laya backend"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
# Test runner for the repository suite. The base package is standard-library
# only.
test = [
    "pytest>=8.0",
]

[project.scripts]
jev-laya-free = "jev_laya_free.server:main"
goblin-jev = "jev_laya_free.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
